{% extends "base.html" %}

{% block title %}Регистрация | Chess for Kids{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <!-- Декоративни фигури (Този път други фигури за разнообразие) -->
    <div class="bg-shape shape-1"><i class="fa-solid fa-chess-queen"></i></div>
    <div class="bg-shape shape-2"><i class="fa-solid fa-chess-bishop"></i></div>

    <div class="auth-card animated-entry">
        <div class="auth-header">
            <div class="icon-avatar register-avatar">
                <i class="fa-solid fa-rocket"></i>
            </div>
            <h1>Нов Герой</h1>
            <p>Създай профил и започни своето приключение.</p>
        </div>

        <form method="POST" class="auth-form">
            <!-- Име -->
            <div class="input-group">
                <div class="input-icon"><i class="fa-solid fa-user"></i></div>
                <input type="text" name="username" minlength="3" required placeholder="Как да те наричаме?">
            </div>

            <!-- Имейл -->
            <div class="input-group">
                <div class="input-icon"><i class="fa-solid fa-envelope"></i></div>
                <input type="email" name="email" required placeholder="Твоят (или на родител) имейл">
            </div>

            <!-- ВИЗУАЛЕН ИЗБОР НА ТЕМА -->
            <div class="theme-selection-group">
                <label class="group-label">Избери цвят на дъската:</label>
                <div class="theme-grid">
                    <!-- Класическа -->
                    <label class="theme-option">
                        <input type="radio" name="board_theme" value="classic" checked>
                        <div class="theme-card">
                            <div class="color-preview classic-preview"></div>
                            <span>Класика</span>
                            <i class="fa-solid fa-circle-check check-icon"></i>
                        </div>
                    </label>

                    <!-- Горска -->
                    <label class="theme-option">
                        <input type="radio" name="board_theme" value="green">
                        <div class="theme-card">
                            <div class="color-preview green-preview"></div>
                            <span>Горска</span>
                            <i class="fa-solid fa-circle-check check-icon"></i>
                        </div>
                    </label>

                    <!-- Черно-бяла -->
                    <label class="theme-option">
                        <input type="radio" name="board_theme" value="blackwhite">
                        <div class="theme-card">
                            <div class="color-preview bw-preview"></div>
                            <span>Зебра</span>
                            <i class="fa-solid fa-circle-check check-icon"></i>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Парола -->
            <div class="input-group">
                <div class="input-icon"><i class="fa-solid fa-lock"></i></div>
                <input type="password" name="password" minlength="6" required placeholder="Парола (тайна!)">
            </div>

            <!-- Повтори Парола -->
            <div class="input-group">
                <div class="input-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <input type="password" name="password_confirm" minlength="6" required placeholder="Повтори паролата">
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-animate">
                Старт на играта <i class="fa-solid fa-play"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Вече имаш герой?</p>
            <a href="{{ url_for('auth.login') }}" class="link-highlight">Влез от тук</a>
        </div>
    </div>
</div>
{% endblock %}
