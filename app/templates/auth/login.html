{% extends "base.html" %}

{% block title %}Вход | Chess for Kids{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <!-- Анимирани фигури за фон (декорация) -->
    <div class="bg-shape shape-1"><i class="fa-solid fa-chess-rook"></i></div>
    <div class="bg-shape shape-2"><i class="fa-solid fa-chess-knight"></i></div>

    <div class="auth-card animated-entry">
        <div class="auth-header">
            <div class="icon-avatar">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <h1>Хайде да играем!</h1>
            <p>Влез и покажи най-добрите си ходове.</p>
        </div>

        <form method="POST" class="auth-form">
            <!-- Поле за Потребител -->
            <div class="input-group">
                <div class="input-icon">
                    <i class="fa-solid fa-user"></i>
                </div>
                <input type="text" name="username" required placeholder="Потребителско име">
            </div>

            <!-- Поле за Парола -->
            <div class="input-group">
                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <input type="password" name="password" required placeholder="Парола">
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-animate">
                Вход в играта <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Нямаш акаунт?</p>
            <a href="{{ url_for('auth.register') }}" class="link-highlight">Създай си герой тук</a>
        </div>
    </div>
</div>
{% endblock %}
