name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/production-stabilization

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app run.py wsgi.py

      - name: Run smoke tests
        env:
          APP_ENV: testing
        run: pytest -q
